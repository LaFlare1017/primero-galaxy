name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The store job shares ONE remote database, and it empties that database before
# it seeds — so two of its runs at once would clear each other's rows and fail
# in a way that reads like a store bug. The per-ref group above already
# serialises a ref against itself; this serialises the store job against every
# other ref, which is the only thing a single shared database can support.
# Neon's per-branch databases would remove the constraint (and the wait) at the
# cost of an API key and a create/drop step.
#
# cancel-in-progress is deliberately off: cancelling a remote run mid-wipe would
# leave the shared database half-seeded for the run that goes next.


jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The production domain (repo secret NEXT_PUBLIC_SITE_URL). Empty on
    # fork PRs, where the build safely falls back to http://localhost:3000.
    env:
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      # The full history, not the default one-commit clone: these checks read git
      # as its own record — the LinkedIn assets count the era as a range between
      # two commits — and a shallow checkout that cannot see it is reported as a
      # reader that could not count, since `--strict` treats that as a failure.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # One entry point for the repo's own checks: the same script a commit runs
      # (`.githooks/pre-commit` calls it with `--fast`) and a developer runs by
      # hand. A tracked path that a rule also covers is invisible to `git status`
      # and to the rule's reader alike, so the gitignore gate and the hook check
      # reach CI through the modules that own them rather than through steps of
      # their own. The hook check runs the tracked hook the way a commit does —
      # twice, the second time against a rule planted in the working .gitignore
      # that it has to refuse — because a hook that was emptied in a refactor, or
      # that quietly lost its executable bit, passes a plain run by doing nothing
      # at all.
      # `--strict` because the states the local run calls warnings — an
      # uninstalled hook, a missing .env.local, an unbuilt workspace — are not
      # choices on a fresh checkout, and the checks that would report them as
      # such stand down instead.
      - name: Repo checks
        run: node scripts/doctor.mjs --strict
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  store:
    name: Store gate (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-store-database
      cancel-in-progress: false
    # The store's SQL is proved on an in-process Postgres; the ADAPTER above it
    # is not, and an in-process engine never goes near it. `neonQuery` — the
    # HTTP driver that is the only reason a serverless function can hold a
    # Postgres connection at all — is the one piece of the deployment path that
    # had never been executed, so it is executed here against a real database
    # with a real connection string.
    #
    # The variable is DELEGATE_STORE_TEST_URL rather than DATABASE_URL on
    # purpose: a gate that changed substrate on the app's own configuration
    # could be pointed at production by a deploy setting rather than by a
    # deliberate act, and these gates call clearAll. The gate refuses any
    # database whose name carries no ci/test/ephemeral/scratch marker, so the
    # worst a misconfigured secret can do is fail loudly.
    env:
      DELEGATE_STORE_TEST_URL: ${{ secrets.DELEGATE_STORE_TEST_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The gates are TypeScript compiled to delegate/dist, and that build needs
      # the nested workspace's own dependencies — the root install does not
      # provide them, which is what the doctor's delegate check reports.
      - run: npm --prefix delegate ci
      - run: npm --prefix delegate run build
      # The in-process leg FIRST, and unconditionally: it is the leg that can
      # prove the one check a shared database cannot — the guard that refuses a
      # `delegate_rows` table this store did not create, which needs an engine
      # it may create and drop a table in. A remote-only run would skip exactly
      # the check that matters most about running against somebody's database.
      #
      # The variable is CLEARED here, at the step, and that is not tidiness. It
      # is set at the job, so without this the "in-process" leg read it too and
      # ran against Neon — testing the SQL twice, over one shared database, and
      # never once against the engine that costs nothing and needs no secret.
      # The gate picks its substrate from this variable and nothing else, so an
      # empty value is how a step says which one it means.
      - name: Store gate on an in-process Postgres
        env:
          DELEGATE_STORE_TEST_URL: ''
        run: node delegate/dist/store/test-store-backends.js
      # Then the same gate, same assertions, over the serverless driver.
      #
      # Two things here are not style. The gate's exit status is read out of
      # the PIPELINE rather than trusted to errexit: piped into `tee`, a failing
      # gate reports `tee`'s status — zero — and this step would go green having
      # proved nothing (and `set -e` is not something to hang a correctness
      # claim on, since the shell GitHub picks is not the shell a reader runs
      # this in). And the engine line is ASSERTED rather than read: a gate that
      # fell back to the in-process engine passes every check it makes while
      # testing the wrong substrate, which is the one outcome this job exists to
      # catch.
      - name: Store gate over the Neon serverless driver
        if: env.DELEGATE_STORE_TEST_URL != ''
        run: |
          node delegate/dist/store/test-store-backends.js 2>&1 | tee /tmp/store-gate-remote.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then echo "::error title=Store gate::the gate failed over the Neon driver (exit $status)"; exit "$status"; fi
          grep -q "postgres leg on remote postgres" /tmp/store-gate-remote.log \
            || { echo "::error title=Store gate::the remote leg did not report a remote engine — it ran on something else, so the driver is untested"; exit 1; }
      # An empty secret has two meanings and they are not the same severity. A
      # FORK pull request gets no secrets from GitHub, so the remote leg cannot
      # run there and saying so is the whole job; every other event — a
      # same-repository pull request, a push to main — is supposed to have the
      # secret, and one that does not is a misconfiguration that would leave
      # the driver untested behind a green tick. So it fails, and it says which
      # of the two happened.
      - name: Say whether the remote leg ran
        if: always() && env.DELEGATE_STORE_TEST_URL == ''
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "::notice title=Store gate::DELEGATE_STORE_TEST_URL is empty — expected on a fork pull request, where GitHub passes no secrets. The remote leg did not run; the in-process one did."
            exit 0
          fi
          echo "::error title=Store gate::DELEGATE_STORE_TEST_URL is empty on ${{ github.event_name }}, and this is not a fork pull request, so the store gate ran on its in-process engine only. The serverless driver is the one piece an in-process engine cannot execute, and it is now untested rather than assumed. Set the repository secret (delegate/README.md#the-store-gate-against-a-real-database)."
          exit 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The playwright.config webServer builds + starts the production build
      # itself, so no separate server step is needed here. CI=1 enables the
      # config's retries (2) and the JSON reporter that feeds the flaky
      # report below.
      - run: npm run test:e2e
        env:
          CI: '1'
      # A flaky test PASSES under retries, so failure-gated artifacts never
      # show it. Parse the JSON report, write the flaky table into the job
      # summary, and expose flaky_count as a step output.
      - name: Surface flaky tests in the job summary
        if: always() && !cancelled()
        id: flaky
        run: node scripts/flaky-report.mjs test-results/results.json
      - name: Upload Playwright report and traces
        # Not failure-gated: a green run with flaky tests still ships the
        # html report plus the retry-attempt traces (trace: on-all-retries).
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse a11y + SEO gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-chrome@v2
      - run: npm run build
      - name: Audit both routes and enforce the 100/100 gate
        run: |
          npm run start -- -p 3100 > /tmp/lh-server.log 2>&1 &
          SERVER=$!
          # Wait until the server answers before auditing.
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3100/ && break
            sleep 1
          done
          npx lighthouse http://localhost:3100/ --output=json \
            --output-path=/tmp/lh-root.json \
            --only-categories=accessibility,seo \
            --chrome-flags="--headless=new --no-sandbox" --quiet
          npx lighthouse http://localhost:3100/galaxy --output=json \
            --output-path=/tmp/lh-galaxy.json \
            --only-categories=accessibility,seo \
            --chrome-flags="--headless=new --no-sandbox" --quiet \
            --max-wait-for-load=60000
          kill $SERVER 2>/dev/null || true
          node scripts/lighthouse-gate.mjs /tmp/lh-root.json /tmp/lh-galaxy.json
